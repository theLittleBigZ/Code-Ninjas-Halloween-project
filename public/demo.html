<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera demo</title>
    <style>
        body { font-family: system-ui, -apple-system, Arial, sans-serif; margin: 16px; }
        h1 { font-size:1.5em; margin-bottom:0.2em; }

        .controls { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
        video { background:#000000; width:100%; max-width:640px; height:auto; border-radius:8px; }
        #preview { margin-top:12px; max-width:640px; display:block; }
        canvas { display:none; }
        .small { color:#2bff00d2; font-size:0.9em; }
        button { font-size:1em; padding: 0.5em; border-radius:4px; border:none; background:#005f87; color:#fff; cursor:pointer; }
        /* Enter below*/
</style>
<style>
    /* From Uiverse.io by Mike11jr */ 
.btn {
 width: 130px;
 height: 40px;
 font-size: 1.1em;
 cursor: pointer;
 background-color: #00d0ff;
 color: #000000;
 border: none;
 border-radius: 5px;
 transition: all .4s;
}

.btn:hover {
 border-radius: 5px;
 transform: translateY(-10px);
 box-shadow: 0 7px 0 -2px #06ff02,
  0 15px 0 -4px #13ba00,
  0 16px 10px -3px #126900;
}

.btn:active {
 transition: all 0.2s;
 transform: translateY(-5px);
 box-shadow: 0 2px 0 -2px #06ff02,
  0 8px 0 -4px #13ba00,
  0 12px 10px -3px #126900;
}

</style>
</head>
<body style="background-color: #0087bc;">
    <h1>Camera demo</h1>
    <div class="controls">
        <label for="device-select" class="small">Camera:</label>
        <select id="device-select"></select>
        <button class="btn" id="start">Start</button>
        <button class="btn"  id="stop">Stop</button>
        <button class="btn"  id="capture">Capture</button>
        <a id="download-link"><button class="btn"  id="capture">Download</button></a>
        
    </div>

    <div class="small">When prompted, click allow. Click/Press capture to take a photo.</div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="preview" alt="Captured photo preview" />

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        const captureBtn = document.getElementById('capture');
        const deviceSelect = document.getElementById('device-select');
        const downloadLink = document.getElementById('download-link');

        let currentStream = null;

        async function getCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cams = devices.filter(d => d.kind === 'videoinput');
                deviceSelect.innerHTML = '';
                cams.forEach((c, idx) => {
                    const opt = document.createElement('option');
                    opt.value = c.deviceId;
                    opt.textContent = c.label || `Camera ${idx+1}`;
                    deviceSelect.appendChild(opt);
                });
                if (!cams.length) {
                    const opt = document.createElement('option');
                    opt.textContent = 'No camera found';
                    deviceSelect.appendChild(opt);
                }
            } catch (err) {
                console.error('enumerateDevices failed', err);
            }
        }

        async function startCamera() {
            if (currentStream) stopCamera();
            const deviceId = deviceSelect.value || undefined;
            const constraints = {
                video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' },
                audio: false
            };
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                alert('Unable to access camera: ' + (err && err.message));
                console.error(err);
            }
        }

        function stopCamera() {
            if (!currentStream) return;
            currentStream.getTracks().forEach(t => t.stop());
            currentStream = null;
            video.srcObject = null;
        }

        function capturePhoto() {
            if (!video || !video.videoWidth) return alert('Camera not started');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/png');
            preview.src = dataUrl;
            downloadLink.href = dataUrl;
            downloadLink.download = `photo-${Date.now()}.png`;
        }

        // Wire UI
        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopCamera);
        captureBtn.addEventListener('click', capturePhoto);

        deviceSelect.addEventListener('change', () => {
            // restart when device changes
            if (currentStream) startCamera();
        });

        // Populate camera list on load
        (async () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
            await getCameras();
            // Auto-start if possible
            // startCamera();
        })();

        // Clean up when page hidden/unloaded
        window.addEventListener('pagehide', stopCamera);
        window.addEventListener('beforeunload', stopCamera);
    </script>
</body>
</html>
