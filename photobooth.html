<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Photo Booth</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="module" src="photobooth.js"></script>
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .stage {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .camera-section, .preview-section {
            flex: 1;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }
        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            overflow: hidden;
            border-radius: 8px;
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .user-info {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #cce5ff; color: #004085; }
        .preview-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Halloween Photo Booth</h1>
        
        <div class="stage">
            <div class="camera-section">
                <h2>Camera Feed</h2>
                <div class="camera-container">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="qr-canvas" class="hidden"></canvas>
                </div>
                <div class="controls">
                    <button id="start-camera" class="primary">Start Camera</button>
                    <button id="switch-camera" class="secondary" disabled>Switch Camera</button>
                    <button id="scan-qr" class="secondary" disabled>Scan QR Code</button>
                    <button id="capture-photo" class="primary" disabled>Take Photo</button>
                </div>
                <div id="scan-status" class="status"></div>
            </div>

            <div class="preview-section">
                <h2>Preview & Info</h2>
                <div id="user-info" class="user-info hidden">
                    <h3>Registration Details</h3>
                    <p><strong>Name:</strong> <span id="user-name"></span></p>
                    <p><strong>Email:</strong> <span id="user-email"></span></p>
                    <p><strong>Children:</strong> <span id="user-children"></span></p>
                    <p><strong>Photos Remaining:</strong> <span id="photos-remaining"></span></p>
                </div>
                <div id="preview-container" class="hidden">
                    <h3>Photo Preview</h3>
                    <img id="preview" class="preview-image" alt="Captured photo preview">
                    <div class="controls">
                        <button id="retake-photo" class="secondary">Retake</button>
                        <button id="save-photo" class="primary">Save Photo</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="device-selector" class="hidden">
            <h3>Select Camera</h3>
            <select id="camera-select"></select>
        </div>

        <div id="overlay" class="overlay hidden">
            <div class="overlay-content">
                <div class="spinner"></div>
                <p id="overlay-message">Processing...</p>
            </div>
        </div>
    </div>
</body>
</html>
